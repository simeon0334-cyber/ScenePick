name: Generate Upload Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore scenepick-upload.jks \
            -alias scenepick \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ScenePickUpload2026! \
            -keypass ScenePickUpload2026! \
            -dname "CN=ScenePick, OU=App, O=ScenePick, L=Burgas, ST=Burgas, C=BG"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: scenepick-keystore
          path: scenepick-upload.jks
          retention-days: 1
