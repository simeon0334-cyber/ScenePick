name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed Google Play App Bundle (.aab)
        type: boolean
        required: true
        default: false
      version_code:
        description: A new positive integer, greater than the last Google Play version code
        type: string
        required: false
      version_name:
        description: Display version for a release, for example 1.0.1
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VITE_OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scenepick-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Validate release inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_BASE64: ${{ secrets.SCENEPICK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SCENEPICK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCENEPICK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCENEPICK_KEY_PASSWORD }}
        run: |
          test -n "$VERSION_CODE" && test "$VERSION_CODE" -ge 1
          test -n "$VERSION_NAME"
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SCENEPICK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scenepick-upload.jks"

      - name: Build signed release bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        working-directory: android
        env:
          SCENEPICK_KEYSTORE_PATH: ${{ runner.temp }}/scenepick-upload.jks
          SCENEPICK_KEYSTORE_PASSWORD: ${{ secrets.SCENEPICK_KEYSTORE_PASSWORD }}
          SCENEPICK_KEY_ALIAS: ${{ secrets.SCENEPICK_KEY_ALIAS }}
          SCENEPICK_KEY_PASSWORD: ${{ secrets.SCENEPICK_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew bundleRelease

      - name: Upload signed Google Play bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: scenepick-google-play-aab-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
