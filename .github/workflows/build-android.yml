name: Build Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SCENEPICK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scenepick-upload.jks"

      - name: Build signed Release AAB
        working-directory: android
        env:
          SCENEPICK_KEYSTORE_PATH: ${{ runner.temp }}/scenepick-upload.jks
          SCENEPICK_KEYSTORE_PASSWORD: ${{ secrets.SCENEPICK_KEYSTORE_PASSWORD }}
          SCENEPICK_KEY_ALIAS: ${{ secrets.SCENEPICK_KEY_ALIAS }}
          SCENEPICK_KEY_PASSWORD: ${{ secrets.SCENEPICK_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: scenepick-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
